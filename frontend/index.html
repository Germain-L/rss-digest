<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Digest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📰 RSS Digest</h1>
            <p class="subtitle">Daily tech news, summarized by AI</p>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="digest">Digest</button>
            <button class="tab" data-tab="feeds">Feeds</button>
        </nav>

        <div id="tab-digest" class="tab-content active">
            <div class="controls">
                <button id="refreshBtn" class="btn-primary">
                    <span class="btn-text">🔄 Refresh Digest</span>
                    <span class="btn-loading" style="display: none;">⏳ Loading...</span>
                </button>
                <span id="lastUpdate" class="last-update"></span>
            </div>

            <div id="status" class="status"></div>

            <main id="digest" class="digest">
                <div class="placeholder">
                    <p>Click "Refresh Digest" to fetch and summarize the latest news</p>
                </div>
            </main>
        </div>

        <div id="tab-feeds" class="tab-content">
            <div class="feeds-header">
                <h2>Manage Feeds</h2>
            </div>

            <form id="addFeedForm" class="add-feed-form">
                <input type="url" id="feedUrl" placeholder="RSS feed URL" required>
                <input type="text" id="feedName" placeholder="Display name (optional)">
                <button type="submit" class="btn-primary">Add Feed</button>
            </form>

            <div id="feedsList" class="feeds-list">
                <p class="loading">Loading feeds...</p>
            </div>
        </div>

        <footer>
            <p>Powered by <a href="https://groq.com" target="_blank">Groq</a> (Llama 3.3 70B) |
            <a href="https://github.com/Germain-L/rss-digest" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
